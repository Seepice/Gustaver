<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki 文本处理工具（1.4.0）</title>
    <style>
        :root {
    --bg-body: #f0f2f5;
    --bg-container: #ffffff;
    --text-primary: #1a202c;
    --text-secondary: #4a5568;
    --text-muted: #718096;
    --bg-input: #fdfdfe;
    --border-input: #cbd5e0;
    --bg-status: #f7fafc;
    --bg-modebar: #f1f4f9;
    --border-modebar: #e2e8f0;
    --bg-info: #ebf8ff;
    --text-info: #718096;
    --bg-btn-secondary: #edf2f7;
    --text-btn-secondary: #2d3748;
    --border-btn-secondary: #cbd5e0;
}
[data-theme="dark"] {
    --bg-body: #1a202c;
    --bg-container: #2d3748;
    --text-primary: #f7fafc;
    --text-secondary: #cbd5e0;
    --text-muted: #a0aec0;
    --bg-input: #4a5568;
    --border-input: #718096;
    --bg-status: #4a5568;
    --bg-modebar: #4a5568;
    --border-modebar: #718096;
    --bg-info: #2d3748;
    --text-info: #e2e8f0;
    --bg-btn-secondary: #4a5568;
    --text-btn-secondary: #f7fafc;
    --border-btn-secondary: #718096;
}
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            margin: 0; padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: var(--bg-container);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }
        #loadingOverlay {
            position: absolute;
            inset: 0;
            background: var(--bg-container);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 40px;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
        #loadingOverlay .icon { font-size: 64px; margin-bottom: 16px; }
        #loadingOverlay h2 { font-size: 24px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
        #loadingOverlay p { color: var(--text-secondary); font-size: 16px; margin-bottom: 24px; }
        #loadingOverlay .folder-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: #4299e1; color: white; border: none;
            padding: 14px 40px; border-radius: 40px;
            font-size: 18px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(66,153,225,0.3);
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        #loadingOverlay .folder-btn:hover { background: #3182ce; transform: translateY(-2px); }
        #loadingOverlay .folder-btn input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer;
        }
        #loadingOverlay .status { margin-top: 20px; font-size: 14px; color: var(--text-secondary); min-height: 24px; }
        #loadingOverlay .status.error { color: #e53e3e; }
        #loadingOverlay .status.success { color: #38a169; }
        #progressContainer {
            width: 80%; max-width: 400px; margin: 12px auto 8px;
            display: none;
        }
        #progressBar {
            width: 0%; height: 20px; background: #ff6b6b; border-radius: 10px;
            transition: width 0.3s ease;
        }
        #progressText {
            font-size: 14px; color: var(--text-secondary); margin-top: 4px; min-height: 20px;
        }
.mode-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--bg-modebar); border-radius: 40px; padding: 4px;
    border: 1px solid var(--border-modebar);
}
.mode-btn {
    border: none; background: transparent;
    padding: 10px 20px; border-radius: 32px;
    font-weight: 600; font-size: 14px; cursor: pointer;
    transition: all 0.2s; color: var(--text-secondary);
    white-space: nowrap;
}
        .mode-btn:hover { background: rgba(255,255,255,0.6); }
        .mode-btn.active { background: #4299e1; color: white; box-shadow: 0 4px 10px rgba(66,153,225,0.3); }
        .mode-btn.uty.active { background: #ed8936; color: white; box-shadow: 0 4px 10px rgba(237,137,54,0.3); }
        .row { display: flex; gap: 20px; flex: 1; }
        .col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
textarea {
    width: 100%; height: 400px; padding: 12px;
    font-size: 14px; font-family: 'Courier New', monospace;
    border: 1px solid var(--border-input); border-radius: 10px;
    resize: vertical; background: var(--bg-input);
    line-height: 1.6; color: var(--text-primary);
}
        textarea:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,0.2); }
        .toolbar {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .btn {
            background: #4299e1; color: white; border: none;
            padding: 10px 24px; border-radius: 30px;
            font-weight: 600; font-size: 14px; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 8px rgba(66,153,225,0.2);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #3182ce; transform: translateY(-1px); }
        .btn:active { transform: scale(0.97); }
.btn-secondary {
    background: var(--bg-btn-secondary);
    color: var(--text-btn-secondary);
    box-shadow: none;
    border: 1px solid var(--border-btn-secondary);
}
.btn-secondary:hover { filter: brightness(0.95); }
.status {
    font-size: 13px; color: var(--text-secondary);
    background: var(--bg-status); padding: 6px 16px; border-radius: 20px;
    margin-left: auto;
}
.info {
    font-size: 13px; color: var(--text-info);
    background: var(--bg-info); border-left: 4px solid #4299e1;
    padding: 8px 16px; border-radius: 0 8px 8px 0;
}
        @media (max-width: 700px) {
            .row { flex-direction: column; }
            textarea { height: 250px; }
            .mode-btn { padding: 8px 14px; font-size: 13px; }
            #progressContainer { width: 90%; }
        }
        #themeToggle {
    background: var(--bg-btn-secondary);
    color: var(--text-btn-secondary);
    border: 1px solid var(--border-btn-secondary);
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
}
#themeToggle:hover { filter: brightness(0.95); }
/* ========== 手动快对：进度框 ========== */
#progressBox {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg-info);
    border-left: 4px solid #e53e3e;
    border-radius: 0 8px 8px 0;
    margin-top: 12px;
}
#progressBox.show { display: flex; }
#progressBox .progress-msg {
    font-size: 14px;
    color: var(--text-primary);
}
#progressBox .progress-msg .red { color: #e53e3e; font-weight: 700; }
#progressBox .progress-enter-btn {
    align-self: flex-start;
    background: #4299e1;
    color: white;
    border: none;
    padding: 8px 28px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
}
#progressBox .progress-enter-btn:hover { background: #3182ce; }

/* ========== 手动快对：独立页面 ========== */
#proofPage {
    display: none;
    flex-direction: column;
    gap: 16px;
    position: absolute;
    inset: 0;
    background: var(--bg-container);
    border-radius: 16px;
    padding: 24px;
    z-index: 30;
}
#proofPage.show { display: flex; }

#proofHeader {
    font-size: 16px;
    color: var(--text-primary);
    font-weight: 600;
}
#proofHeader .red { color: #e53e3e; font-weight: 700; }

#proofToolbar {
    display: flex;
    gap: 10px;
    justify-content: flex-start;
    align-items: center;
    flex-wrap: wrap;
}
#proofToolbar button {
    padding: 8px 20px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid var(--border-btn-secondary);
    background: var(--bg-btn-secondary);
    color: var(--text-btn-secondary);
}
#proofToolbar button:hover { filter: brightness(0.95); }
#proofToolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
#proofToolbar #proofThemeToggle {
    margin-left: auto;
}

#proofUnmatched {
    padding: 12px 16px;
    border: 1px solid var(--border-input);
    border-radius: 10px;
    background: var(--bg-input);
    color: var(--text-primary);
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 60px;
}

#proofChoices {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.proof-choice {
    padding: 12px 16px;
    border: 1px solid var(--border-input);
    border-radius: 10px;
    background: var(--bg-input);
    color: var(--text-primary);
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.6;
    cursor: pointer;
    white-space: pre-wrap;
    word-break: break-word;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.proof-choice:hover {
    border-color: #4299e1;
    box-shadow: 0 0 0 3px rgba(66,153,225,0.15);
}

/* ========== 退出确认弹窗 ========== */
#exitConfirm {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
    align-items: center;
    justify-content: center;
}
#exitConfirm.show { display: flex; }
#exitConfirm .dialog {
    background: var(--bg-container);
    border-radius: 16px;
    padding: 24px 28px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
#exitConfirm .dialog-msg {
    font-size: 15px;
    color: var(--text-primary);
    margin-bottom: 20px;
    line-height: 1.6;
}
#exitConfirm .dialog-msg .red { color: #e53e3e; font-weight: 700; }
#exitConfirm .dialog-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
}
#exitConfirm .btn-exit-yes {
    background: #ed8936;
    color: #c53030;
    border: none;
    padding: 8px 24px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
}
#exitConfirm .btn-exit-yes:hover { filter: brightness(0.95); }
#exitConfirm .btn-exit-no {
    background: white;
    color: black;
    border: 1px solid var(--border-btn-secondary);
    padding: 8px 24px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
}
#exitConfirm .btn-exit-no:hover { filter: brightness(0.95); }

/* ========== 红心光标 ========== */
#heartCursor {
    display: none;
    position: fixed;
    width: 32px;
    height: 32px;
    background-image: url('heart.png');
    background-size: contain;
    background-repeat: no-repeat;
    pointer-events: none;
    z-index: 60;
    transition: left 0.12s ease, top 0.12s ease;
}
#heartCursor.show { display: block; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loadingOverlay">
        <div class="icon">📂</div>
        <h2>请加载词典至此处</h2>
        <p>选择包含 <strong>ch1.js</strong> ~ <strong>ch5.js</strong> 和 <strong>uty.js</strong> 的文件夹</p>
        <button class="folder-btn" id="folderBtn">
            📁 选择文件夹
            <input type="file" id="folderInput" webkitdirectory directory multiple />
        </button>
        <div id="progressContainer">
            <div id="progressBar"></div>
            <div id="progressText">准备加载...</div>
        </div>
        <div class="status" id="loadStatus">等待加载...</div>
    </div>
    <div id="mainContent" style="display:none;">
        <div class="mode-bar" id="modeBar">
            <button class="mode-btn active" data-mode="ch1">第1章</button>
            <button class="mode-btn" data-mode="ch2">第2章</button>
            <button class="mode-btn" data-mode="ch3">第3章</button>
            <button class="mode-btn" data-mode="ch4">第4章</button>
            <button class="mode-btn" data-mode="ch5">第5章</button>
            <button class="mode-btn uty" data-mode="uty">UTY</button>
        </div>
        <div class="info" id="infoText">
            功能简介：<br />
            🦆 DR模式: 替换为<code>{{DR文本|吧嗒吧嗒|chX}}</code>模板<br />
            💛 UTY模式: 直接替换为中文<br />
            替换范围：<br />
                斜体的对话, <code>{{Cite game|哈喽! 我是Radiat·Aktinim! |Aktinim, 首次见面}}</code>←Cite<br />
            game模板内文本,以及粗体内的战斗回合等。
        </div>
        <div class="row">
            <div class="col">
                <label style="font-weight:600; font-size:14px; color:var(--text-primary);">↓📥 请输入文本</label>
                <textarea id="inputArea" placeholder="在这里粘贴待处理的文本。"></textarea>
            </div>
<div class="col">
    <label style="font-weight:600; font-size:14px; color:var(--text-primary);">↓💻 协议 已 拟定。————Queen</label>
    <textarea id="outputArea" placeholder="处理后的结果。" readonly></textarea>
    <div id="progressBox">
        <div class="progress-msg">*💻还剩 <span class="red" id="progressCount">0</span> 个。无法严格替换，是否进入手动快速校对？</div>
        <button class="progress-enter-btn" id="progressEnterBtn">*🦌继续前进</button>
    </div>
</div>
        </div>
        <div class="toolbar">
            <button class="btn" id="processBtn">▶ 开始处理</button>
            <button class="btn btn-secondary" id="copyBtn">📋 复制输出</button>
            <button class="btn btn-secondary" id="clearInputBtn">🗑 清空输入</button>
            <button class="btn btn-secondary" id="applyToInputBtn">🔄 应用到输入</button>
            <span class="status" id="status">就绪</span>
            <button id="themeToggle">🌙</button>
        </div>
    </div>
<!-- ========== 手动快对页面 ========== -->
<div id="proofPage">
    <div id="proofHeader">*还剩 <span class="red" id="proofRemain">0</span> 个，这是第 <span id="proofIndex">0</span> 个</div>
    <div id="proofToolbar">
        <button id="proofExitBtn">❌退出</button>
        <button id="proofNextBtn">→下一个</button>
        <button id="proofPrevBtn">←上一个</button>
        <button id="proofModeBtn">💛按钮模式</button>
        <button id="proofThemeToggle">🌙</button>
    </div>
    <div id="proofUnmatched"></div>
    <div id="proofChoices"></div>
</div>
</div>
<!-- ========== 退出确认弹窗 ========== -->
<div id="exitConfirm">
    <div class="dialog">
        <div class="dialog-msg">*还剩 <span class="red" id="exitRemain">0</span> 个。确定退出吗？退出会全保留且无法再进入</div>
        <div class="dialog-actions">
            <button class="btn-exit-yes" id="exitYesBtn">退出</button>
            <button class="btn-exit-no" id="exitNoBtn">不退出</button>
        </div>
    </div>
</div>

<!-- ========== 红心光标 ========== -->
<div id="heartCursor"></div>
<script>
(function() {
    'use strict';
    // ---------- DOM 引用 ----------
    const loadingOverlay = document.getElementById('loadingOverlay');
    const mainContent = document.getElementById('mainContent');
    const folderInput = document.getElementById('folderInput');
    const loadStatus = document.getElementById('loadStatus');
    const modeBar = document.getElementById('modeBar');
    const inputArea = document.getElementById('inputArea');
    const outputArea = document.getElementById('outputArea');
    const statusDiv = document.getElementById('status');
    const infoText = document.getElementById('infoText');
    const processBtn = document.getElementById('processBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearInputBtn = document.getElementById('clearInputBtn');
    const applyToInputBtn = document.getElementById('applyToInputBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    let dataStore = {};
    let currentMode = 'ch1';
    let mapping = {};
    let keyOrder = [];
    let chapterParam = null;
    let isUTY = false;

    // ---------- 工具函数 ----------
    const BOLD_PLACEHOLDER = '\x01BOLD\x02';
    function protectBold(text) { return text.replace(/'''/g, BOLD_PLACEHOLDER); }
    function restoreBold(text) { return text.replace(new RegExp(BOLD_PLACEHOLDER.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&'), 'g'), "'''"); }
    function removeItalics(text) { return text.replace(/''(.*?)''/g, '$1'); }
    function cleanValue(value) {
        if (value.startsWith('* ')) return value.substring(2);
        if (value.startsWith('*')) return value.substring(1);
        return value;
    }
    function stripLeadingStar(str) {
        if (str.startsWith('* ')) return str.substring(2);
        if (str.startsWith('*')) return str.substring(1);
        return str;
    }
    function chineseNum(n) {
        const nums = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
        return nums[n] || String(n);
    }
    function keysMostlySame(key1, key2) {
        const parts1 = key1.split('_');
        const parts2 = key2.split('_');
        if (parts1.length < 2 || parts2.length < 2) return false;
        if (parts1.length !== parts2.length) return false;
        const newParts1 = [...parts1];
        const newParts2 = [...parts2];
        newParts1[newParts1.length - 2] = '';
        newParts2[newParts2.length - 2] = '';
        return newParts1.join('_') === newParts2.join('_');
    }

    function applyBoldReplacements(line) {
        return line.replace(/'''((?:(?!''').)*?)'''/g, (match, content) => {
            let replaced = content;
            replaced = replaced.replace(/Turn\s+(\d+)/gi, (_, num) => `第${chineseNum(parseInt(num))}回合`);
            replaced = replaced.replace(/Phase\s+(\d+)/gi, (_, num) => `第${chineseNum(parseInt(num))}阶段`);
            replaced = replaced.replace(/\bAction\b/gi, '行动');
            replaced = replaced.replace(/\bcheck\b/gi, '检查');
            replaced = replaced.replace(/Neutral/g, '中立');
            return `'''${replaced}'''`;
        });
    }

    function parseItalic(line) {
        const match = line.match(/''(.*?)''/);
        if (!match) return null;
        const full = match[0];
        const inside = match[1];
        let hasSpan = false;
        let spanTag = null;
        let textBetween = inside;
        if (inside.includes('<span')) {
            const startTagEnd = inside.indexOf('>');
            if (startTagEnd !== -1) {
                const closeTagStart = inside.lastIndexOf('</span>');
                if (closeTagStart !== -1 && closeTagStart > startTagEnd) {
                    textBetween = inside.substring(startTagEnd + 1, closeTagStart);
                    spanTag = inside.substring(0, startTagEnd + 1) + inside.substring(closeTagStart);
                    hasSpan = true;
                } else {
                    const lastLt = inside.lastIndexOf('<');
                    if (lastLt > startTagEnd) {
                        textBetween = inside.substring(startTagEnd + 1, lastLt);
                        spanTag = inside.substring(0, startTagEnd + 1) + inside.substring(lastLt);
                        hasSpan = true;
                    }
                }
            }
        }
        return { full, inside, hasSpan, spanTag, textBetween };
    }

    function loadMapping(mode) {
        if (!dataStore[mode]) {
            statusDiv.textContent = `⚠️ 未找到 ${mode} 的数据`;
            return false;
        }
        const rawObj = dataStore[mode];
        if (mode === 'uty') {
            mapping = rawObj;
            keyOrder = [];
            chapterParam = null;
            isUTY = true;
            statusDiv.textContent = `已加载 UTY 映射 (${Object.keys(mapping).length} 条)`;
        } else {
            keyOrder = [];
            mapping = {};
            for (const [key, value] of Object.entries(rawObj)) {
                if (!(value in mapping)) {
                    mapping[value] = key;
                    keyOrder.push(key);
                }
            }
            chapterParam = mode;
            isUTY = false;
            statusDiv.textContent = `已加载 ${mode.toUpperCase()} 映射 (${Object.keys(mapping).length} 条唯一值)`;
        }
        return true;
    }

function processSegment(segment, isUTY) {
    let text = segment.replace(/''(.*?)''/g, '$1');
    const textStripped = stripLeadingStar(text).toLowerCase();
    if (isUTY) {
        let found = null;
        for (const [en, zh] of Object.entries(mapping)) {
            const enStripped = stripLeadingStar(en).toLowerCase();
            if (enStripped === textStripped) {
                found = zh;
                break;
            }
        }
        return found !== null ? found : segment;
    } else {
        let foundKey = null;
        for (const [value, key] of Object.entries(mapping)) {
            const valStripped = stripLeadingStar(value).toLowerCase();
            if (valStripped === textStripped) {
                foundKey = key;
                break;
            }
        }
        if (foundKey !== null) {
            return `{{DR文本|${foundKey}|${chapterParam}}}`;
        } else {
            return segment;
        }
    }
}
    
    function preprocessCiteGame(text, isUTY) {
        return text.replace(/\{\{Cite game\|((?:[^|]+\|)*[^|]+)\}\}/g, (match, inner) => {
            const segments = inner.split('|');
            const processed = segments.map(seg => processSegment(seg, isUTY));
            return `{{Cite game|${processed.join('|')}}}`;
        });
    }

function processDR(inputText) {
    const lines = inputText.split('\n');
    const protectedLines = lines.map(protectBold);
    const lineData = protectedLines.map(line => {
        const italicInfo = parseItalic(line);
        let newLine, isReplaced, keyName;
        if (italicInfo) {
            const matchText = italicInfo.textBetween;
            let foundKey = null;
            // 匹配时忽略开头的 * （两边都去）
            const matchStripped = stripLeadingStar(matchText).toLowerCase();
            for (const [value, key] of Object.entries(mapping)) {

                if (valStripped === matchStripped) {

                }

            if (foundKey !== null) {

                newLine = line.replace(/''.*?''/, template);

                    }

                    matches = [];
                    for (const [value, key] of Object.entries(mapping)) {
                        const valStripped = stripLeadingStar(value);

    for (let i = 0; i < lineData.length; i++) {

        const nextData = lineData[i+1];

        const curKey = data.key;
        const prevKey = prevData.key;
        const nextKey = nextData.key;
        if (keysMostlySame(curKey, prevKey) || keysMostlySame(curKey, nextKey)) continue;
        let correctedKey = null;
        if (keysMostlySame(prevKey, nextKey)) {
            const idxPrev = keyOrder.indexOf(prevKey);

            if (idxPrev !== -1 && idxNext !== -1 && Math.abs(idxPrev - idxNext) === 2) {
                const midIdx = (idxPrev + idxNext) >> 1;
                correctedKey = keyOrder[midIdx];
            }
        }
        if (correctedKey === null && data.italicInfo) {
            const prevPrefix = prevKey.substring(0, 5);
            const nextPrefix = nextKey.substring(0, 5);
            const matchText = data.italicInfo.textBetween;
            const matchStripped = stripLeadingStar(matchText);
            for (let len = 3; len <= Math.min(10, matchStripped.length); len++) {

                for (const [value, key] of Object.entries(mapping)) {
                    const valStripped = stripLeadingStar(value);
                    if (valStripped.startsWith(prefix) && key.startsWith(prevPrefix)) matches.push(key);
                }
                if (matches.length === 1) { correctedKey = matches[0]; break; }
                matches = [];
                for (const [value, key] of Object.entries(mapping)) {
                    const valStripped = stripLeadingStar(value);
                    if (valStripped.startsWith(prefix) && key.startsWith(nextPrefix)) matches.push(key);
                }
                if (matches.length === 1) { correctedKey = matches[0]; break; }
            }
        }
        if (correctedKey !== null) {
            const oldTemplate = `{{DR文本|${curKey}|${chapterParam}}}`;
            const newTemplate = `{{DR文本|${correctedKey}|${chapterParam}}}`;
            data.line = data.line.replace(oldTemplate, newTemplate);
            data.key = correctedKey;
        } else {
            data.line = data.original;
            data.isReplaced = false;
            data.key = null;
        }
    }

    // 收集未替换项
    const unmatched = [];
    lineData.forEach((d, idx) => {
        if (!d.isReplaced && d.italicInfo) {
            unmatched.push({
                absoluteIndex: idx,
                text: d.italicInfo.textBetween,
                italicFull: d.italicInfo.full,
            });
        }
    });

    let resultLines = lineData.map(d => {
        let line = restoreBold(d.line);
        line = applyBoldReplacements(line);
        return line;
    });
    return { text: resultLines.join('\n'), unmatched };
}

                    matches = [];

                    }

    document.getElementById('progressEnterBtn').addEventListener('click', function() {
        openProofPage();
    });

    // ========== 事件绑定：对照页退出 ==========
    document.getElementById('proofExitBtn').addEventListener('click', function() {
        if (proofState.unmatched.length > 0) {
            document.getElementById('exitRemain').textContent = proofState.unmatched.length;
            document.getElementById('exitConfirm').classList.add('show');
        } else {
            closeProofPage();
        }
    });

    document.getElementById('exitYesBtn').addEventListener('click', function() {
        document.getElementById('exitConfirm').classList.remove('show');
        closeProofPage();
    });

    document.getElementById('exitNoBtn').addEventListener('click', function() {
        document.getElementById('exitConfirm').classList.remove('show');
    });

    // ========== 事件绑定：对照页主题切换（独立于主页面） ==========
    document.getElementById('proofThemeToggle').addEventListener('click', function() {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? '' : 'dark');
        document.getElementById('proofThemeToggle').textContent = isDark ? '🌙' : '☀️';
    });
    // ========== 相似度计算 ==========
    function jaccardSimilarity(a, b) {
        if (a.length < 2 || b.length < 2) return 0;
        const setA = new Set();
        const setB = new Set();
        for (let i = 0; i < a.length - 1; i++) setA.add(a.slice(i, i + 2));
        for (let i = 0; i < b.length - 1; i++) setB.add(b.slice(i, i + 2));
        let inter = 0;
        for (const x of setA) if (setB.has(x)) inter++;
        const union = setA.size + setB.size - inter;
        return union === 0 ? 0 : inter / union;
    }

    function wordOverlapRatio(a, b) {
        const tokenize = s => s.toLowerCase().split(/[\s,.!?;:"']+/).filter(Boolean);
        const tokA = tokenize(a);
        const tokB = tokenize(b);
        if (tokA.length === 0 || tokB.length === 0) return 0;
        const setB = new Set(tokB);
        let inter = 0;
        for (const w of tokA) if (setB.has(w)) inter++;
        return inter / Math.max(tokA.length, tokB.length);
    }

    function similarity(a, b) {
        if (a.length <= SHORT_TEXT_THRESHOLD) return jaccardSimilarity(a, b);
        return wordOverlapRatio(a, b);
    }

    // ========== 相似搜索：从当前章节词典里找前 3 个 ==========
    function findSimilarEntries(text) {
        const lowerText = text.toLowerCase();
        const minLen = lowerText.length * 0.85;
        const candidates = [];
        for (const [enText, target] of Object.entries(mapping)) {
            // 长度过滤：比未替换文本短 15% 以上的剔除
            if (enText.length < minLen) continue;
            const sim = similarity(lowerText, enText.toLowerCase());
            candidates.push({ enText, target, sim });
        }
        candidates.sort((a, b) => b.sim - a.sim);
        return candidates.slice(0, 3);
    }

    // ========== 保留原文 ==========
    function handleKeep(absoluteIndex) {
        const itemIdx = proofState.unmatched.findIndex(x => x.absoluteIndex === absoluteIndex);
        if (itemIdx === -1) return;
        proofState.unmatched.splice(itemIdx, 1);
        afterChoice();
    }

    // ========== 执行替换 ==========
    function handleReplace(absoluteIndex, candidate) {
        const lines = outputArea.value.split('\n');
        const line = lines[absoluteIndex];
        if (line === undefined) return;

        const match = line.match(/''(.*?)''/);
        if (!match) return;

        let replacement;
        if (isUTY) {
            replacement = candidate.target;
        } else {
            replacement = `{{DR文本|${candidate.target}|${chapterParam}}}`;
        }
        lines[absoluteIndex] = line.replace(/''.*?''/, replacement);
        outputArea.value = lines.join('\n');

        const itemIdx = proofState.unmatched.findIndex(x => x.absoluteIndex === absoluteIndex);
        if (itemIdx === -1) return;
        proofState.unmatched.splice(itemIdx, 1);
        afterChoice();
    }

    // ========== 选择后的公共处理 ==========
    function afterChoice() {
        if (proofState.unmatched.length === 0) {
            closeProofPage();
            return;
        }
        if (proofState.currentIndex >= proofState.unmatched.length) {
            proofState.currentIndex = proofState.unmatched.length - 1;
        }
        proofState.heartPos = -1;
        renderProofPage();
    }

    // ========== 下一个 / 上一个 ==========
    document.getElementById('proofNextBtn').addEventListener('click', function() {
        if (proofState.currentIndex < proofState.unmatched.length - 1) {
            proofState.currentIndex++;
            proofState.heartPos = -1;
            renderProofPage();
        }
    });

    document.getElementById('proofPrevBtn').addEventListener('click', function() {
        if (proofState.currentIndex > 0) {
            proofState.currentIndex--;
            proofState.heartPos = -1;
            renderProofPage();
        }
    });
    // ========== 红心光标位置更新 ==========
    function updateHeartPosition() {
        const heart = document.getElementById('heartCursor');
        if (!proofState.buttonMode) {
            heart.classList.remove('show');
            return;
        }
        heart.classList.add('show');

        let target = null;
        if (proofState.heartPos === -1) {
            target = document.getElementById('proofUnmatched');
        } else {
            const choices = document.querySelectorAll('#proofChoices .proof-choice');
            target = choices[proofState.heartPos];
        }
        if (!target) {
            heart.classList.remove('show');
            return;
        }
        const rect = target.getBoundingClientRect();
        const heartSize = 32;
        const gap = 6;
        heart.style.left = (rect.left - heartSize - gap) + 'px';
        heart.style.top = (rect.top + rect.height / 2 - heartSize / 2) + 'px';
    }

    window.addEventListener('resize', function() {
        if (proofState.buttonMode) updateHeartPosition();
    });

    // ========== 进入 / 退出按钮模式 ==========
    function enterButtonMode() {
        proofState.buttonMode = true;
        proofState.heartPos = -1;
        document.getElementById('proofNextBtn').style.display = 'none';
        document.getElementById('proofPrevBtn').style.display = 'none';
        updateHeartPosition();
    }

    function exitButtonMode() {
        proofState.buttonMode = false;
        proofState.heartPos = -1;
        document.getElementById('proofNextBtn').style.display = '';
        document.getElementById('proofPrevBtn').style.display = '';
        document.getElementById('heartCursor').classList.remove('show');
    }

    document.getElementById('proofModeBtn').addEventListener('click', function() {
        if (proofState.buttonMode) {
            exitButtonMode();
        } else {
            enterButtonMode();
        }
    });

    // ========== 键盘事件 ==========
    document.addEventListener('keydown', function(e) {
        const proofPage = document.getElementById('proofPage');
        if (!proofPage.classList.contains('show')) return;

        const now = Date.now();

        // Shift 三下退出按钮模式
        if (e.key === 'Shift') {
            if (now - proofState.shiftPressTime < 600) {
                proofState.shiftPressCount++;
            } else {
                proofState.shiftPressCount = 1;
            }
            proofState.shiftPressTime = now;
            if (proofState.shiftPressCount >= 3 && proofState.buttonMode) {
                proofState.shiftPressCount = 0;
                exitButtonMode();
            }
            return;
        }

        // X 退出按钮模式
        if ((e.key === 'x' || e.key === 'X') && proofState.buttonMode) {
            exitButtonMode();
            e.preventDefault();
            return;
        }

        // ↓ 三下进入按钮模式（仅非按钮模式）
        if (e.key === 'ArrowDown' && !proofState.buttonMode) {
            if (now - proofState.downPressTime < 600) {
                proofState.downPressCount++;
            } else {
                proofState.downPressCount = 1;
            }
            proofState.downPressTime = now;
            if (proofState.downPressCount >= 3) {
                proofState.downPressCount = 0;
                enterButtonMode();
            }
            e.preventDefault();
            return;
        }

        if (!proofState.buttonMode) return;

        // Enter / Z
        if (e.key === 'Enter' || e.key === 'z' || e.key === 'Z') {
            if (proofState.heartPos === -1) {
                if (proofState.choices.length > 0) {
                    proofState.heartPos = 0;
                    updateHeartPosition();
                }
            } else {
                const item = proofState.unmatched[proofState.currentIndex];
                const candidate = proofState.choices[proofState.heartPos];
                if (item && candidate) {
                    handleReplace(item.absoluteIndex, candidate);
                    proofState.heartPos = -1;
                }
            }
            e.preventDefault();
            return;
        }

        // 上
        if (e.key === 'ArrowUp') {
            if (proofState.heartPos > 0) {
                proofState.heartPos--;
                updateHeartPosition();
            }
            e.preventDefault();
            return;
        }

        // 下
        if (e.key === 'ArrowDown') {
            if (proofState.heartPos >= 0 && proofState.heartPos < proofState.choices.length - 1) {
                proofState.heartPos++;
                updateHeartPosition();
            }
            e.preventDefault();
            return;
        }

        // 右：下一个未替换项
        if (e.key === 'ArrowRight') {
            if (proofState.currentIndex < proofState.unmatched.length - 1) {
                proofState.currentIndex++;
                renderProofPage();
                proofState.heartPos = proofState.choices.length - 1;
                updateHeartPosition();
            }
            e.preventDefault();
            return;
        }

        // 左：上一个未替换项
        if (e.key === 'ArrowLeft') {
            if (proofState.currentIndex > 0) {
                proofState.currentIndex--;
                renderProofPage();
                proofState.heartPos = proofState.choices.length - 1;
                updateHeartPosition();
            }
            e.preventDefault();
            return;
        }
    });

    // ========== 非 PC 隐藏按钮模式按钮 ==========
    (function() {
        const isPC = !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        if (!isPC) {
            document.getElementById('proofModeBtn').style.display = 'none';
        }
    })();
})();
</script>
