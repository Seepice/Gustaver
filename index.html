<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki 替换器</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 1200px; width: 100%; background: white; border-radius: 16px; padding: 24px; }
        textarea { width: 100%; height: 300px; padding: 12px; font-size: 14px; font-family: monospace; border: 1px solid #ccc; border-radius: 8px; }
        .btn { background: #4299e1; color: white; border: none; padding: 10px 24px; border-radius: 30px; cursor: pointer; }
        .btn:hover { background: #3182ce; }
        .mode-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .mode-btn { padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; background: #e2e8f0; }
        .mode-btn.active { background: #4299e1; color: white; }
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 250px; }
        .toolbar { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .status { font-size: 14px; color: #4a5568; padding: 6px 16px; background: #f7fafc; border-radius: 20px; }
        #loadingOverlay { text-align: center; padding: 40px; }
        #progressBar { width: 0%; height: 6px; background: #4299e1; border-radius: 10px; transition: width 0.3s; }
        #progressContainer { max-width: 400px; margin: 12px auto; display: none; }
</head>
<body>
<div class="container" id="app">
    <div id="loadingOverlay">
        <h2>加载词典</h2>
        <button id="folderBtn" style="padding:12px 30px;border:none;background:#4299e1;color:#fff;border-radius:40px;cursor:pointer;">📁 选择文件夹</button>
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;" />
        <div id="progressContainer"><div id="progressBar"></div><div id="progressText">准备...</div></div>
        <div id="loadStatus">等待加载...</div>
    </div>
    <div id="mainContent" style="display:none;">
        <div class="mode-bar" id="modeBar">
            <button class="mode-btn active" data-mode="ch1">第1章</button>
            <button class="mode-btn" data-mode="ch2">第2章</button>
            <button class="mode-btn" data-mode="ch3">第3章</button>
            <button class="mode-btn" data-mode="ch4">第4章</button>
            <button class="mode-btn" data-mode="ch5">第5章</button>
            <button class="mode-btn" data-mode="uty">UTY</button>
        </div>
        <div class="row">
            <div class="col"><textarea id="inputArea" placeholder="输入文本..."></textarea></div>
            <div class="col"><textarea id="outputArea" placeholder="输出结果..." readonly></textarea></div>
        </div>
        <div class="toolbar">
            <button class="btn" id="processBtn">▶ 处理</button>
            <button class="btn" id="copyBtn">📋 复制</button>
            <button class="btn" id="clearOutputBtn">🗑 清空</button>
            <span class="status" id="status">就绪</span>
        </div>
    </div>
</div>
<script>
(function(){
    'use strict';
    const loadingOverlay = document.getElementById('loadingOverlay');
    const mainContent = document.getElementById('mainContent');
    const folderInput = document.getElementById('folderInput');
    const loadStatus = document.getElementById('loadStatus');
    const modeBar = document.getElementById('modeBar');
    const inputArea = document.getElementById('inputArea');
    const outputArea = document.getElementById('outputArea');
    const statusDiv = document.getElementById('status');
    const processBtn = document.getElementById('processBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearOutputBtn = document.getElementById('clearOutputBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    let dataStore = {};
    let currentMode = 'ch1';
    let mapping = {};
    let keyOrder = [];
    let chapterParam = null;
    let isUTY = false;
        const BOLD_PLACEHOLDER = '\x01BOLD\x02';
    function protectBold(t){return t.replace(/'''/g,BOLD_PLACEHOLDER);}
    function restoreBold(t){return t.replace(new RegExp(BOLD_PLACEHOLDER.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&'),'g'),"'''");}
    function removeItalics(t){return t.replace(/''(.*?)''/g,'$1');}
    function cleanValue(v){if(v.startsWith('* '))return v.substring(2);if(v.startsWith('*'))return v.substring(1);return v;}
    function chineseNum(n){const a=['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];return a[n]||String(n);}
    function keysMostlySame(a,b){const p1=a.split('_'),p2=b.split('_');if(p1.length<2||p2.length<2)return false;if(p1.length!==p2.length)return false;const n1=[...p1],n2=[...p2];n1[n1.length-2]='';n2[n2.length-2]='';return n1.join('_')===n2.join('_');}

    function normalizeColorTags(t){
        const m={'red':'\\cR','yellow':'\\cY','green':'\\cG','blue':'\\cB','cyan':'\\cC','magenta':'\\cM','orange':'\\cO','purple':'\\cP','white':'\\cW'};
        for(const [tag,code] of Object.entries(m)){t=t.replace(new RegExp(`<${tag}>`,'gi'),code);}
        ['yellow','red','green','blue','cyan','magenta','orange','purple','white'].forEach(tag=>{t=t.replace(new RegExp(`</${tag}>`,'gi'),'\\cW');});
        t=t.replace(/(\\c[A-Z])+/gi,(m)=>{const c=m.match(/\\c[A-Z]/g);return c[c.length-1];});
        return t;
    }
    function denormalizeColorTags(t){
        const m={'\\cR':'<red>','\\cY':'<yellow>','\\cG':'<green>','\\cB':'<blue>','\\cC':'<cyan>','\\cM':'<magenta>','\\cO':'<orange>','\\cP':'<purple>','\\cW':'</yellow>'};
        for(const [code,tag] of Object.entries(m)){t=t.replace(new RegExp(code.replace(/\\/g,'\\\\'),'g'),tag);}
        return t;
    }
    function applyBoldReplacements(line){
        return line.replace(/'''((?:(?!''').)*?)'''/g,(m,c)=>{
            let r=c;
            r=r.replace(/Turn\s+(\d+)/gi,(_,n)=>`第${chineseNum(parseInt(n))}回合`);
            r=r.replace(/Phase\s+(\d+)/gi,(_,n)=>`第${chineseNum(parseInt(n))}阶段`);
            r=r.replace(/\bAction\b/gi,'行动');
            r=r.replace(/\bcheck\b/gi,'检查');
            r=r.replace(/Neutral/g,'中立');
            return `'''${r}'''`;
        });
    }
    function parseItalic(line){
        const m=line.match(/''(.*?)''/);if(!m)return null;
        const full=m[0],inside=m[1];let hasSpan=false,spanTag=null,textBetween=inside;
        if(inside.includes('<span')){
            const start=inside.indexOf('>');
            if(start!==-1){
                const close=inside.lastIndexOf('</span>');
                if(close!==-1&&close>start){textBetween=inside.substring(start+1,close);spanTag=inside.substring(0,start+1)+inside.substring(close);hasSpan=true;}
                else{const last=inside.lastIndexOf('<');if(last>start){textBetween=inside.substring(start+1,last);spanTag=inside.substring(0,start+1)+inside.substring(last);hasSpan=true;}}
            }
        }
        return {full,inside,hasSpan,spanTag,textBetween};
                 }
            function loadMapping(mode){
        if(!dataStore[mode]){statusDiv.textContent='⚠️ 未找到 '+mode+' 的数据';return false;}
        const obj=dataStore[mode];
        if(mode==='uty'){mapping=obj;keyOrder=[];chapterParam=null;isUTY=true;statusDiv.textContent='已加载 UTY ('+Object.keys(mapping).length+' 条)';}
        else{keyOrder=[];mapping={};for(const [k,v] of Object.entries(obj)){if(!(v in mapping)){mapping[v]=k;keyOrder.push(k);}}chapterParam=mode;isUTY=false;statusDiv.textContent='已加载 '+mode.toUpperCase()+' ('+Object.keys(mapping).length+' 条)';}
        return true;
    }
    function processSegment(seg,isUTY){
        let text=seg.replace(/''(.*?)''/g,'$1');
        if(isUTY){for(const [en,zh] of Object.entries(mapping)){if(en.toLowerCase()===text.toLowerCase())return zh;}return seg;}
        else{for(const [v,k] of Object.entries(mapping)){if(cleanValue(v).toLowerCase()===text.toLowerCase())return `{{DR文本|${k}|${chapterParam}}}`;}return seg;}
    }
    function preprocessCiteGame(text,isUTY){
        return text.replace(/\{\{Cite game\|((?:[^|]+\|)*[^|]+)\}\}/g,(m,inner)=>{const segs=inner.split('|');const processed=segs.map(s=>processSegment(s,isUTY));return `{{Cite game|${processed.join('|')}}}`;});
    }
    function processDR(input){
        const lines=input.split('\n');
        const protectedLines=lines.map(protectBold);
        const lineData=protectedLines.map(line=>{
            const info=parseItalic(line);
            let newLine,isReplaced,keyName;
            if(info){
                const mt=info.textBetween;let found=null;
                for(const [v,k] of Object.entries(mapping)){if(cleanValue(v).toLowerCase()===mt.toLowerCase()){found=k;break;}}
                if(found!==null){newLine=line.replace(/''.*?''/,`{{DR文本|${found}|${chapterParam}}}`);isReplaced=true;keyName=found;}
                else{newLine=removeItalics(line);isReplaced=false;keyName=null;}
            }else{newLine=line;isReplaced=false;keyName=null;}
            return {original:line,italicInfo:info,line:newLine,isReplaced,key:keyName};
        });
        for(let i=0;i<lineData.length;i++){const d=lineData[i];if(d.isReplaced)continue;if(i>0&&i<lineData.length-1&&lineData[i-1].isReplaced&&lineData[i+1].isReplaced){const prev=lineData[i-1].key,next=lineData[i+1].key,info=d.italicInfo;if(!info)continue;let corr=null;if(keysMostlySame(prev,next)){const pi=keyOrder.indexOf(prev),ni=keyOrder.indexOf(next);if(pi!==-1&&ni!==-1&&Math.abs(pi-ni)===2){corr=keyOrder[(pi+ni)>>1];}}if(corr===null){const pp=prev.substring(0,5),np=next.substring(0,5),mt=info.textBetween;for(let len=3;len<=Math.min(10,mt.length);len++){const pre=mt.substring(0,len);let ms=[];for(const [v,k] of Object.entries(mapping)){if(cleanValue(v).startsWith(pre)&&k.startsWith(pp))ms.push(k);}if(ms.length===1){corr=ms[0];break;}ms=[];for(const [v,k] of Object.entries(mapping)){if(cleanValue(v).startsWith(pre)&&k.startsWith(np))ms.push(k);}if(ms.length===1){corr=ms[0];break;}}}if(corr!==null){d.line=d.original.replace(/''.*?''/,`{{DR文本|${corr}|${chapterParam}}}`);d.isReplaced=true;d.key=corr;}}}
        for(let i=0;i<lineData.length;i++){const d=lineData[i];if(!d.isReplaced)continue;if(i===0||i===lineData.length-1)continue;const pd=lineData[i-1],nd=lineData[i+1];if(!pd.isReplaced||!nd.isReplaced)continue;const cur=d.key,prev=pd.key,next=nd.key;if(keysMostlySame(cur,prev)||keysMostlySame(cur,next))continue;let corr=null;if(keysMostlySame(prev,next)){const pi=keyOrder.indexOf(prev),ni=keyOrder.indexOf(next);if(pi!==-1&&ni!==-1&&Math.abs(pi-ni)===2){corr=keyOrder[(pi+ni)>>1];}}if(corr===null&&d.italicInfo){const pp=prev.substring(0,5),np=next.substring(0,5),mt=d.italicInfo.textBetween;for(let len=3;len<=Math.min(10,mt.length);len++){const pre=mt.substring(0,len);let ms=[];for(const [v,k] of Object.entries(mapping)){if(cleanValue(v).startsWith(pre)&&k.startsWith(pp))ms.push(k);}if(ms.length===1){corr=ms[0];break;}ms=[];for(const [v,k] of Object.entries(mapping)){if(cleanValue(v).startsWith(pre)&&k.startsWith(np))ms.push(k);}if(ms.length===1){corr=ms[0];break;}}}if(corr!==null){const oldT=`{{DR文本|${cur}|${chapterParam}}}`;const newT=`{{DR文本|${corr}|${chapterParam}}}`;d.line=d.line.replace(oldT,newT);d.key=corr;}else{d.line=d.original;d.isReplaced=false;d.key=null;}}
        return lineData.map(d=>{let line=restoreBold(d.line);line=applyBoldReplacements(line);return line;}).join('\n');
             }
        function processUTY(input){
        const lines=input.split('\n');
        const lineData=lines.map(line=>{
            let pl=protectBold(line),nl=pl,isReplaced=false,keyName=null,info=null;
            const m=pl.match(/''(.*?)''/);
            if(m){
                const full=m[0],inside=m[1];let hasSpan=false,spanTag=null,textBetween=inside;
                if(inside.includes('<span')){
                    const start=inside.indexOf('>');
                    if(start!==-1){
                        const close=inside.lastIndexOf('</span>');
                        if(close!==-1&&close>start){textBetween=inside.substring(start+1,close);spanTag=inside.substring(0,start+1)+inside.substring(close);hasSpan=true;}
                        else{const last=inside.lastIndexOf('<');if(last>start){textBetween=inside.substring(start+1,last);spanTag=inside.substring(0,start+1)+inside.substring(last);hasSpan=true;}}
                    }
                }
                let found=null;
                for(const [en,zh] of Object.entries(mapping)){if(en.toLowerCase()===textBetween.toLowerCase()){found=en;break;}}
                if(found!==null){
                    let rep=mapping[found];
                    if(hasSpan&&spanTag)rep=spanTag.replace(textBetween,rep);
                    nl=pl.replace(full,rep);isReplaced=true;keyName=found;
                }else{nl=pl.replace(/''(.*?)''/g,'$1');isReplaced=false;keyName=null;}
                info={full,inside,hasSpan,spanTag,textBetween};
            }
            return {original:pl,italicInfo:info,line:nl,isReplaced,key:keyName};
        });
        for(let i=0;i<lineData.length;i++){const d=lineData[i];if(d.isReplaced)continue;if(i>0&&i<lineData.length-1&&lineData[i-1].isReplaced&&lineData[i+1].isReplaced){const prev=lineData[i-1].key,next=lineData[i+1].key,info=d.italicInfo;if(!info)continue;let corr=null;if(keysMostlySame(prev,next)){const pi=keyOrder.indexOf(prev),ni=keyOrder.indexOf(next);if(pi!==-1&&ni!==-1&&Math.abs(pi-ni)===2){corr=keyOrder[(pi+ni)>>1];}}if(corr===null){const pp=prev.substring(0,5),np=next.substring(0,5),mt=info.textBetween;for(let len=3;len<=Math.min(10,mt.length);len++){const pre=mt.substring(0,len);let ms=[];for(const [en,zh] of Object.entries(mapping)){if(en.startsWith(pre)&&en.startsWith(pp))ms.push(en);}if(ms.length===1){corr=ms[0];break;}ms=[];for(const [en,zh] of Object.entries(mapping)){if(en.startsWith(pre)&&en.startsWith(np))ms.push(en);}if(ms.length===1){corr=ms[0];break;}}}if(corr!==null){const rep=mapping[corr];let repText=rep;if(info.hasSpan&&info.spanTag)repText=info.spanTag.replace(info.textBetween,rep);d.line=d.original.replace(info.full,repText);d.isReplaced=true;d.key=corr;}}}
        return lineData.map(d=>{let line=restoreBold(d.line);line=applyBoldReplacements(line);return line;}).join('\n');
    }
    function handleProcess(){
        const input=inputArea.value;
        if(!input.trim()){statusDiv.textContent='⚠️ 请先输入文本';return;}
        if(Object.keys(mapping).length===0){statusDiv.textContent='⚠️ 映射为空';return;}
        let norm=normalizeColorTags(input);
        norm=preprocessCiteGame(norm,isUTY);
        let result=isUTY?processUTY(norm):processDR(norm);
        result=denormalizeColorTags(result);
        outputArea.value=result;
        statusDiv.textContent='✅ 完成';
    }
    function switchMode(mode){
        if(mode===currentMode)return;
        document.querySelectorAll('.mode-btn').forEach(b=>{b.classList.remove('active');if(b.dataset.mode===mode)b.classList.add('active');});
        currentMode=mode;outputArea.value='';
        if(!loadMapping(mode)){mapping={};keyOrder=[];}
            }
        function updateProgress(cur,total,name,st){const p=total>0?Math.round((cur/total)*100):0;progressBar.style.width=p+'%';progressText.textContent=`加载 ${name} (${p}%)`;if(st)loadStatus.textContent=st;}
    async function autoLoad(){
        const names=['ch1','ch2','ch3','ch4','ch5','uty'],base='txtmap/';
        const loaded={};let all=true;
        progressContainer.style.display='block';progressBar.style.width='0%';progressText.textContent='准备...';
        for(let i=0;i<names.length;i++){
            const name=names[i];
            updateProgress(i,names.length,name,`加载 ${name}.js ...`);
            try{const url=base+name+'.js';const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const txt=await r.text();const obj=new Function('return '+txt)();if(typeof obj==='object'&&obj!==null)loaded[name]=obj;else throw new Error('无效对象');}
            catch(e){console.warn('自动加载 '+name+'.js 失败:',e);all=false;break;}
        }
        if(all&&Object.keys(loaded).length===names.length){
            progressBar.style.width='100%';progressText.textContent='✅ 完成！';
            dataStore=loaded;loadingOverlay.classList.add('hidden');mainContent.style.display='block';
            if(!loadMapping('ch1')){const first=Object.keys(dataStore)[0];if(first){loadMapping(first);document.querySelectorAll('.mode-btn').forEach(b=>{b.classList.remove('active');if(b.dataset.mode===first)b.classList.add('active');});currentMode=first;}}
            loadStatus.textContent='✅ 已自动加载';loadStatus.className='status success';return true;
        }else{progressText.textContent='⚠️ 自动加载失败';loadStatus.textContent='请手动选择文件夹';loadStatus.className='status error';progressContainer.style.display='none';return false;}
    }
    autoLoad().then(s=>{if(!s){loadingOverlay.classList.remove('hidden');mainContent.style.display='none';loadStatus.textContent='请手动选择文件夹';loadStatus.className='status';progressContainer.style.display='none';}});
    document.getElementById('folderBtn').addEventListener('click',()=>{document.getElementById('folderInput').click();});
    folderInput.addEventListener('change',async function(e){
        const files=e.target.files;if(!files||files.length===0){loadStatus.textContent='❌ 未选择文件';loadStatus.className='status error';return;}
        loadStatus.textContent='⏳ 读取中...';loadStatus.className='status';
        progressContainer.style.display='block';progressBar.style.width='0%';progressText.textContent='准备...';
        const fileMap={};for(const f of files){const name=f.name;if(!name.endsWith('.js'))continue;const base=name.replace(/\.js$/,'');if(!/^ch[1-5]$/.test(base)&&base!=='uty')continue;fileMap[base]=f;}
        const expected=['ch1','ch2','ch3','ch4','ch5','uty'];const found=Object.keys(fileMap);const missing=expected.filter(m=>!found.includes(m));
        if(found.length===0){loadStatus.textContent='❌ 未找到词典文件';loadStatus.className='status error';progressContainer.style.display='none';return;}
        const loaded={};let err=0;let processed=0;const total=found.length;
        for(const [mode,file] of Object.entries(fileMap)){
            processed++;updateProgress(processed,total,file.name,`加载 ${file.name} ...`);
            try{const txt=await file.text();const obj=new Function('return '+txt)();if(typeof obj==='object'&&obj!==null)loaded[mode]=obj;else throw new Error('无效对象');}
            catch(e){err++;console.error('加载 '+mode+'.js 失败:',e);loadStatus.textContent='❌ 加载 '+mode+'.js 失败';loadStatus.className='status error';}
        }
        progressBar.style.width='100%';progressText.textContent='✅ 加载完成！';
        if(Object.keys(loaded).length===0){loadStatus.textContent='❌ 全部加载失败';loadStatus.className='status error';progressContainer.style.display='none';return;}
        dataStore=loaded;
        let msg='✅ 成功加载 '+Object.keys(loaded).length+' 个文件';if(missing.length>0)msg+='，缺失: '+missing.join(', ');if(err>0)msg+='，'+err+' 个失败';
        loadStatus.textContent=msg;loadStatus.className='status success';
        loadingOverlay.classList.add('hidden');mainContent.style.display='block';
        if(!loadMapping('ch1')){const first=Object.keys(dataStore)[0];if(first){loadMapping(first);document.querySelectorAll('.mode-btn').forEach(b=>{b.classList.remove('active');if(b.dataset.mode===first)b.classList.add('active');});currentMode=first;}}
    });
    modeBar.addEventListener('click',e=>{const b=e.target.closest('.mode-btn');if(!b)return;switchMode(b.dataset.mode);});
    processBtn.addEventListener('click',handleProcess);
    copyBtn.addEventListener('click',async()=>{const t=outputArea.value;if(!t){statusDiv.textContent='📋 无内容';return;}try{await navigator.clipboard.writeText(t);statusDiv.textContent='📋 已复制';}catch{outputArea.select();document.execCommand('copy');statusDiv.textContent='📋 已复制';}});
    clearOutputBtn.addEventListener('click',()=>{outputArea.value='';statusDiv.textContent='已清空';});
    loadingOverlay.classList.remove('hidden');mainContent.style.display='none';loadStatus.textContent='等待加载...';loadStatus.className='status';progressContainer.style.display='none';
})();
</script>
</body>
</html>
