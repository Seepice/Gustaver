<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki 文本处理工具（1.2.1）</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            margin: 0; padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }
        #loadingOverlay {
            position: absolute;
            inset: 0;
            background: white;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 40px;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
        #loadingOverlay .icon { font-size: 64px; margin-bottom: 16px; }
        #loadingOverlay h2 { font-size: 24px; font-weight: 600; color: #0a1e2f; margin-bottom: 8px; }
        #loadingOverlay p { color: #4a5b6e; font-size: 16px; margin-bottom: 24px; }
        #loadingOverlay .folder-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: #4299e1; color: white; border: none;
            padding: 14px 40px; border-radius: 40px;
            font-size: 18px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(66,153,225,0.3);
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        #loadingOverlay .folder-btn:hover { background: #3182ce; transform: translateY(-2px); }
        #loadingOverlay .folder-btn input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer;
        }
        #loadingOverlay .status {
            margin-top: 20px; font-size: 14px; color: #4a5568; min-height: 24px;
        }
        #loadingOverlay .status.error { color: #e53e3e; }
        #loadingOverlay .status.success { color: #38a169; }
        #progressContainer {
            width: 80%; max-width: 400px; margin: 12px auto 8px;
            display: none;
        }
        #progressBar {
            width: 0%; height: 20px; background: #ff6b6b; border-radius: 10px;
            transition: width 0.3s ease;
        }
        #progressText {
            font-size: 14px; color: #4a5568; margin-top: 4px; min-height: 20px;
        }
        .mode-bar {
            display: flex; gap: 8px; flex-wrap: wrap;
            background: #f1f4f9; border-radius: 40px; padding: 4px;
            border: 1px solid #e2e8f0;
        }
        .mode-btn {
            border: none; background: transparent;
            padding: 10px 20px; border-radius: 32px;
            font-weight: 600; font-size: 14px; cursor: pointer;
            transition: all 0.2s; color: #4a5568;
            white-space: nowrap;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.6); }
        .mode-btn.active { background: #4299e1; color: white; box-shadow: 0 4px 10px rgba(66,153,225,0.3); }
        .mode-btn.uty.active { background: #ed8936; color: white; box-shadow: 0 4px 10px rgba(237,137,54,0.3); }
        .row { display: flex; gap: 20px; flex: 1; }
        .col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        textarea {
            width: 100%; height: 400px; padding: 12px;
            font-size: 14px; font-family: 'Courier New', monospace;
            border: 1px solid #cbd5e0; border-radius: 10px;
            resize: vertical; background: #fdfdfe;
            line-height: 1.6;
        }
        textarea:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,0.2); }
        .toolbar {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .btn {
            background: #4299e1; color: white; border: none;
            padding: 10px 24px; border-radius: 30px;
            font-weight: 600; font-size: 14px; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 8px rgba(66,153,225,0.2);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #3182ce; transform: translateY(-1px); }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: #edf2f7; color: #2d3748; box-shadow: none; }
        .btn-secondary:hover { background: #e2e8f0; }
        .status {
            font-size: 13px; color: #4a5568;
            background: #f7fafc; padding: 6px 16px; border-radius: 20px;
            margin-left: auto;
        }
        .info {
            font-size: 13px; color: #718096;
            background: #ebf8ff; border-left: 4px solid #4299e1;
            padding: 8px 16px; border-radius: 0 8px 8px 0;
        }
        @media (max-width: 700px) {
            .row { flex-direction: column; }
            textarea { height: 250px; }
            .mode-btn { padding: 8px 14px; font-size: 13px; }
            #progressContainer { width: 90%; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loadingOverlay">
        <div class="icon">📂</div>
        <h2>请加载词典至此处</h2>
        <p>选择包含 <strong>ch1.js</strong> ~ <strong>ch5.js</strong> 和 <strong>uty.js</strong> 的文件夹</p>
        <button class="folder-btn" id="folderBtn">
            📁 选择文件夹
            <input type="file" id="folderInput" webkitdirectory directory multiple />
        </button>
        <div id="progressContainer">
            <div id="progressBar"></div>
            <div id="progressText">准备加载...</div>
        </div>
        <div class="status" id="loadStatus">等待加载...</div>
    </div>
    <div id="mainContent" style="display:none;">
        <div class="mode-bar" id="modeBar">
            <button class="mode-btn active" data-mode="ch1">第1章</button>
            <button class="mode-btn" data-mode="ch2">第2章</button>
            <button class="mode-btn" data-mode="ch3">第3章</button>
            <button class="mode-btn" data-mode="ch4">第4章</button>
            <button class="mode-btn" data-mode="ch5">第5章</button>
            <button class="mode-btn uty" data-mode="uty">UTY</button>
        </div>
        <div class="info" id="infoText">
            📌 DR模式：斜体匹配（忽略大小写，自动转换颜色标签）<br />
            🔸 UTY模式：直接替换中文（忽略大小写，自动转换颜色标签）<br />
            ⚡ 加粗内术语自动替换（Turn/Phase/Action/check/Neutral）<br />
            📦 <code>{{Cite game|...}}</code> 内部字段自动整段匹配（无需手动加斜体）
        </div>
        <div class="row">
            <div class="col">
                <label style="font-weight:600; font-size:14px; color:#2d3748;">📥 输入文本</label>
                <textarea id="inputArea" placeholder="在这里粘贴待处理的文本..."></textarea>
            </div>
            <div class="col">
                <label style="font-weight:600; font-size:14px; color:#2d3748;">📤 输出结果</label>
                <textarea id="outputArea" placeholder="处理后的结果..." readonly></textarea>
            </div>
        </div>
        <div class="toolbar">
            <button class="btn" id="processBtn">▶ 开始处理</button>
            <button class="btn btn-secondary" id="copyBtn">📋 复制输出</button>
            <button class="btn btn-secondary" id="clearOutputBtn">🗑 清空输出</button>
            <button class="btn btn-secondary" id="pasteInputBtn">📎 粘贴到输入</button>
            <button class="btn btn-secondary" id="applyToInputBtn">🔄 应用到输入</button>
            <span class="status" id="status">就绪</span>
        </div>
    </div>
</div>
<script>
(function() {
    'use strict';
    // ---------- DOM 引用 ----------
    const loadingOverlay = document.getElementById('loadingOverlay');
    const mainContent = document.getElementById('mainContent');
    const folderInput = document.getElementById('folderInput');
    const loadStatus = document.getElementById('loadStatus');
    const modeBar = document.getElementById('modeBar');
    const inputArea = document.getElementById('inputArea');
    const outputArea = document.getElementById('outputArea');
    const statusDiv = document.getElementById('status');
    const infoText = document.getElementById('infoText');
    const processBtn = document.getElementById('processBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearOutputBtn = document.getElementById('clearOutputBtn');
    const pasteInputBtn = document.getElementById('pasteInputBtn');
    const applyToInputBtn = document.getElementById('applyToInputBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    let dataStore = {};
    let currentMode = 'ch1';
    let mapping = {};
    let keyOrder = [];
    let chapterParam = null;
    let isUTY = false;

    // ---------- 工具函数 ----------
    const BOLD_PLACEHOLDER = '\x01BOLD\x02';
    function protectBold(text) { return text.replace(/'''/g, BOLD_PLACEHOLDER); }
    function restoreBold(text) { return text.replace(new RegExp(BOLD_PLACEHOLDER.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&'), 'g'), "'''"); }
    function removeItalics(text) { return text.replace(/''(.*?)''/g, '$1'); }
    function cleanValue(value) {
        if (value.startsWith('* ')) return value.substring(2);
        if (value.startsWith('*')) return value.substring(1);
        return value;
    }
    function chineseNum(n) {
        const nums = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
        return nums[n] || String(n);
    }
    function keysMostlySame(key1, key2) {
        const parts1 = key1.split('_');
        const parts2 = key2.split('_');
        if (parts1.length < 2 || parts2.length < 2) return false;
        if (parts1.length !== parts2.length) return false;
        const newParts1 = [...parts1];
        const newParts2 = [...parts2];
        newParts1[newParts1.length - 2] = '';
        newParts2[newParts2.length - 2] = '';
        return newParts1.join('_') === newParts2.join('_');
    }

    function applyBoldReplacements(line) {
        return line.replace(/'''((?:(?!''').)*?)'''/g, (match, content) => {
            let replaced = content;
            replaced = replaced.replace(/Turn\s+(\d+)/gi, (_, num) => `第${chineseNum(parseInt(num))}回合`);
            replaced = replaced.replace(/Phase\s+(\d+)/gi, (_, num) => `第${chineseNum(parseInt(num))}阶段`);
            replaced = replaced.replace(/\bAction\b/gi, '行动');
            replaced = replaced.replace(/\bcheck\b/gi, '检查');
            replaced = replaced.replace(/Neutral/g, '中立');
            return `'''${replaced}'''`;
        });
    }

    function parseItalic(line) {
        const match = line.match(/''(.*?)''/);
        if (!match) return null;
        const full = match[0];
        const inside = match[1];
        let hasSpan = false;
        let spanTag = null;
        let textBetween = inside;
        if (inside.includes('<span')) {
            const startTagEnd = inside.indexOf('>');
            if (startTagEnd !== -1) {
                const closeTagStart = inside.lastIndexOf('</span>');
                if (closeTagStart !== -1 && closeTagStart > startTagEnd) {
                    textBetween = inside.substring(startTagEnd + 1, closeTagStart);
                    spanTag = inside.substring(0, startTagEnd + 1) + inside.substring(closeTagStart);
                    hasSpan = true;
                } else {
                    const lastLt = inside.lastIndexOf('<');
                    if (lastLt > startTagEnd) {
                        textBetween = inside.substring(startTagEnd + 1, lastLt);
                        spanTag = inside.substring(0, startTagEnd + 1) + inside.substring(lastLt);
                        hasSpan = true;
                    }
                }
            }
        }
        return { full, inside, hasSpan, spanTag, textBetween };
    }

    function loadMapping(mode) {
        if (!dataStore[mode]) {
            statusDiv.textContent = `⚠️ 未找到 ${mode} 的数据`;
            return false;
        }
        const rawObj = dataStore[mode];
        if (mode === 'uty') {
            mapping = rawObj;
            keyOrder = [];
            chapterParam = null;
            isUTY = true;
            statusDiv.textContent = `已加载 UTY 映射 (${Object.keys(mapping).length} 条)`;
        } else {
            keyOrder = [];
            mapping = {};
            for (const [key, value] of Object.entries(rawObj)) {
                if (!(value in mapping)) {
                    mapping[value] = key;
                    keyOrder.push(key);
                }
            }
            chapterParam = mode;
            isUTY = false;
            statusDiv.textContent = `已加载 ${mode.toUpperCase()} 映射 (${Object.keys(mapping).length} 条唯一值)`;
        }
        infoText.innerHTML = isUTY
            ? '🔸 UTY模式：直接替换中文（忽略大小写，自动转换颜色标签）<br />⚡ 加粗术语替换<br />📦 Cite Game 内部字段自动整段匹配'
            : `📌 DR模式：斜体匹配（忽略大小写，自动转换颜色标签） → <code>{{DR文本|ID|${chapterParam}}}</code><br />⚡ 加粗术语替换<br />📦 Cite Game 内部字段自动整段匹配`;
        return true;
    }

    function processSegment(segment, isUTY) {
        let text = segment.replace(/''(.*?)''/g, '$1');
        if (isUTY) {
            let found = null;
            for (const [en, zh] of Object.entries(mapping)) {
                if (en.toLowerCase() === text.toLowerCase()) {
                    found = zh;
                    break;
                }
            }
            return found !== null ? found : segment;
        } else {
            let foundKey = null;
            for (const [value, key] of Object.entries(mapping)) {
                const clean = cleanValue(value);
                if (clean.toLowerCase() === text.toLowerCase()) {
                    foundKey = key;
                    break;
                }
            }
            if (foundKey !== null) {
                return `{{DR文本|${foundKey}|${chapterParam}}}`;
            } else {
                return segment;
            }
        }
    }

    function preprocessCiteGame(text, isUTY) {
        return text.replace(/\{\{Cite game\|((?:[^|]+\|)*[^|]+)\}\}/g, (match, inner) => {
            const segments = inner.split('|');
            const processed = segments.map(seg => processSegment(seg, isUTY));
            return `{{Cite game|${processed.join('|')}}}`;
        });
    }

    function processDR(inputText) {
        const lines = inputText.split('\n');
        const protectedLines = lines.map(protectBold);
        const lineData = protectedLines.map(line => {
            const italicInfo = parseItalic(line);
            let newLine, isReplaced, keyName;
            if (italicInfo) {
                const matchText = italicInfo.textBetween;
                let foundKey = null;
                for (const [value, key] of Object.entries(mapping)) {
                    const clean = cleanValue(value);
                    if (clean.toLowerCase() === matchText.toLowerCase()) {
                        foundKey = key;
                        break;
                    }
                }
                if (foundKey !== null) {
                    const template = `{{DR文本|${foundKey}|${chapterParam}}}`;
                    newLine = line.replace(/''.*?''/, template);
                    isReplaced = true;
                    keyName = foundKey;
                } else {
                    newLine = line;
                    isReplaced = false;
                    keyName = null;
                }
            } else {
                newLine = line;
                isReplaced = false;
                keyName = null;
            }
            return { original: line, italicInfo, line: newLine, isReplaced, key: keyName };
        });

        for (let i = 0; i < lineData.length; i++) {
            const data = lineData[i];
            if (data.isReplaced) continue;
            if (i > 0 && i < lineData.length - 1 &&
                lineData[i-1].isReplaced && lineData[i+1].isReplaced) {
                const prevKey = lineData[i-1].key;
                const nextKey = lineData[i+1].key;
                const italicInfo = data.italicInfo;
                if (!italicInfo) continue;
                let correctedKey = null;
                if (keysMostlySame(prevKey, nextKey)) {
                    const idxPrev = keyOrder.indexOf(prevKey);
                    const idxNext = keyOrder.indexOf(nextKey);
                    if (idxPrev !== -1 && idxNext !== -1 && Math.abs(idxPrev - idxNext) === 2) {
                        const midIdx = (idxPrev + idxNext) >> 1;
                        correctedKey = keyOrder[midIdx];
                    }
                }
                if (correctedKey === null) {
                    const prevPrefix = prevKey.substring(0, 5);
                    const nextPrefix = nextKey.substring(0, 5);
                    const matchText = italicInfo.textBetween;
                    for (let len = 3; len <= Math.min(10, matchText.length); len++) {
                        const prefix = matchText.substring(0, len);
                        let matches = [];
                        for (const [value, key] of Object.entries(mapping)) {
                            if (cleanValue(value).startsWith(prefix) && key.startsWith(prevPrefix)) matches.push(key);
                        }
                        if (matches.length === 1) { correctedKey = matches[0]; break; }
                        matches = [];
                        for (const [value, key] of Object.entries(mapping)) {
                            if (cleanValue(value).startsWith(prefix) && key.startsWith(nextPrefix)) matches.push(key);
                        }
                        if (matches.length === 1) { correctedKey = matches[0]; break; }
                    }
                }
                if (correctedKey !== null) {
                    const template = `{{DR文本|${correctedKey}|${chapterParam}}}`;
                    data.line = data.original.replace(/''.*?''/, template);
                    data.isReplaced = true;
                    data.key = correctedKey;
                }
            }
        }

        for (let i = 0; i < lineData.length; i++) {
            const data = lineData[i];
            if (!data.isReplaced) continue;
            if (i === 0 || i === lineData.length - 1) continue;
            const prevData = lineData[i-1];
            const nextData = lineData[i+1];
            if (!prevData.isReplaced || !nextData.isReplaced) continue;
            const curKey = data.key;
            const prevKey = prevData.key;
            const nextKey = nextData.key;
            if (keysMostlySame(curKey, prevKey) || keysMostlySame(curKey, nextKey)) continue;
            let correctedKey = null;
            if (keysMostlySame(prevKey, nextKey)) {
                const idxPrev = keyOrder.indexOf(prevKey);
                const idxNext = keyOrder.indexOf(nextKey);
                if (idxPrev !== -1 && idxNext !== -1 && Math.abs(idxPrev - idxNext) === 2) {
                    const midIdx = (idxPrev + idxNext) >> 1;
                    correctedKey = keyOrder[midIdx];
                }
            }
            if (correctedKey === null && data.italicInfo) {
                const prevPrefix = prevKey.substring(0, 5);
                const nextPrefix = nextKey.substring(0, 5);
                const matchText = data.italicInfo.textBetween;
                for (let len = 3; len <= Math.min(10, matchText.length); len++) {
                    const prefix = matchText.substring(0, len);
                    let matches = [];
                    for (const [value, key] of Object.entries(mapping)) {
                        if (cleanValue(value).startsWith(prefix) && key.startsWith(prevPrefix)) matches.push(key);
                    }
                    if (matches.length === 1) { correctedKey = matches[0]; break; }
                    matches = [];
                    for (const [value, key] of Object.entries(mapping)) {
                        if (cleanValue(value).startsWith(prefix) && key.startsWith(nextPrefix)) matches.push(key);
                    }
                    if (matches.length === 1) { correctedKey = matches[0]; break; }
                }
            }
            if (correctedKey !== null) {
                const oldTemplate = `{{DR文本|${curKey}|${chapterParam}}}`;
                const newTemplate = `{{DR文本|${correctedKey}|${chapterParam}}}`;
                data.line = data.line.replace(oldTemplate, newTemplate);
                data.key = correctedKey;
            } else {
                data.line = data.original;
                data.isReplaced = false;
                data.key = null;
            }
        }

        let resultLines = lineData.map(d => {
            let line = restoreBold(d.line);
            line = applyBoldReplacements(line);
            return line;
        });
        return resultLines.join('\n');
    }

    function processUTY(inputText) {
        const lines = inputText.split('\n');
        const lineData = lines.map(line => {
            let protectedLine = protectBold(line);
            let newLine = protectedLine;
            let isReplaced = false;
            let keyName = null;
            let italicInfo = null;
            const match = protectedLine.match(/''(.*?)''/);
            if (match) {
                const full = match[0];
                const inside = match[1];
                let hasSpan = false;
                let spanTag = null;
                let textBetween = inside;
                if (inside.includes('<span')) {
                    const startTagEnd = inside.indexOf('>');
                    if (startTagEnd !== -1) {
                        const closeTagStart = inside.lastIndexOf('</span>');
                        if (closeTagStart !== -1 && closeTagStart > startTagEnd) {
                            textBetween = inside.substring(startTagEnd + 1, closeTagStart);
                            spanTag = inside.substring(0, startTagEnd + 1) + inside.substring(closeTagStart);
                            hasSpan = true;
                        } else {
                            const lastLt = inside.lastIndexOf('<');
                            if (lastLt > startTagEnd) {
                                textBetween = inside.substring(startTagEnd + 1, lastLt);
                                spanTag = inside.substring(0, startTagEnd + 1) + inside.substring(lastLt);
                                hasSpan = true;
                            }
                        }
                    }
                }
                let foundKey = null;
                for (const [en, zh] of Object.entries(mapping)) {
                    if (en.toLowerCase() === textBetween.toLowerCase()) {
                        foundKey = en;
                        break;
                    }
                }
                if (foundKey !== null) {
                    const zhTranslation = mapping[foundKey];
                    let replaceText = zhTranslation;
                    if (hasSpan && spanTag) {
                        replaceText = spanTag.replace(textBetween, zhTranslation);
                    }
                    newLine = protectedLine.replace(full, replaceText);
                    isReplaced = true;
                    keyName = foundKey;
                } else {
                    newLine = protectedLine.replace(/''(.*?)''/g, '$1');
                    isReplaced = false;
                    keyName = null;
                }
                italicInfo = { full, inside, hasSpan, spanTag, textBetween };
            }
            return { original: protectedLine, italicInfo, line: newLine, isReplaced, key: keyName };
        });

        for (let i = 0; i < lineData.length; i++) {
            const data = lineData[i];
            if (data.isReplaced) continue;
            if (i > 0 && i < lineData.length - 1 &&
                lineData[i-1].isReplaced && lineData[i+1].isReplaced) {
                const prevKey = lineData[i-1].key;
                const nextKey = lineData[i+1].key;
                const italicInfo = data.italicInfo;
                if (!italicInfo) continue;
                let correctedKey = null;
                if (keysMostlySame(prevKey, nextKey)) {
                    const idxPrev = keyOrder.indexOf(prevKey);
                    const idxNext = keyOrder.indexOf(nextKey);
                    if (idxPrev !== -1 && idxNext !== -1 && Math.abs(idxPrev - idxNext) === 2) {
                        const midIdx = (idxPrev + idxNext) >> 1;
                        correctedKey = keyOrder[midIdx];
                    }
                }
                if (correctedKey === null) {
                    const prevPrefix = prevKey.substring(0, 5);
                    const nextPrefix = nextKey.substring(0, 5);
                    const matchText = italicInfo.textBetween;
                    for (let len = 3; len <= Math.min(10, matchText.length); len++) {
                        const prefix = matchText.substring(0, len);
                        let matches = [];
                        for (const [en, zh] of Object.entries(mapping)) {
                            if (en.startsWith(prefix) && en.startsWith(prevPrefix)) matches.push(en);
                        }
                        if (matches.length === 1) { correctedKey = matches[0]; break; }
                        matches = [];
                        for (const [en, zh] of Object.entries(mapping)) {
                            if (en.startsWith(prefix) && en.startsWith(nextPrefix)) matches.push(en);
                        }
                        if (matches.length === 1) { correctedKey = matches[0]; break; }
                    }
                }
                if (correctedKey !== null) {
                    const zhTranslation = mapping[correctedKey];
                    const full = italicInfo.full;
                    let replaceText = zhTranslation;
                    if (italicInfo.hasSpan && italicInfo.spanTag) {
                        replaceText = italicInfo.spanTag.replace(italicInfo.textBetween, zhTranslation);
                    }
                    data.line = data.original.replace(full, replaceText);
                    data.isReplaced = true;
                    data.key = correctedKey;
                }
            }
        }

        const resultLines = lineData.map(d => {
            let line = restoreBold(d.line);
            line = applyBoldReplacements(line);
            return line;
        });
        return resultLines.join('\n');
    }

    function handleProcess() {
        const input = inputArea.value;
        if (!input.trim()) {
            statusDiv.textContent = '⚠️ 请先输入文本';
            return;
        }
        if (Object.keys(mapping).length === 0) {
            statusDiv.textContent = '⚠️ 映射数据为空，请检查词典加载';
            return;
        }
        normalized = preprocessCiteGame(normalized, isUTY);
        let result;
        if (isUTY) {
            result = processUTY(normalized);
        } else {
            result = processDR(normalized);
        }
        outputArea.value = result;
        statusDiv.textContent = '✅ 处理完成';
    }

    function switchMode(mode) {
        if (mode === currentMode) return;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.mode === mode) btn.classList.add('active');
        });
        currentMode = mode;
        outputArea.value = '';
        const success = loadMapping(mode);
        if (!success) {
            mapping = {};
            keyOrder = [];
        }
    }

    async function copyOutput() {
        const text = outputArea.value;
        if (!text) { statusDiv.textContent = '📋 没有内容可复制'; return; }
        try {
            await navigator.clipboard.writeText(text);
            statusDiv.textContent = '📋 已复制到剪贴板';
        } catch {
            outputArea.select();
            document.execCommand('copy');
            statusDiv.textContent = '📋 已复制（降级方案）';
        }
    }
    function clearOutput() { outputArea.value = ''; statusDiv.textContent = '输出已清空'; }
    async function pasteToInput() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) { inputArea.value = text; statusDiv.textContent = '📎 已粘贴到输入框'; }
            else { statusDiv.textContent = '剪贴板为空'; }
        } catch (err) { statusDiv.textContent = '无法读取剪贴板，请手动粘贴'; }
    }
    applyToInputBtn.addEventListener('click', function() {
        const output = outputArea.value;
        if (!output) {
            statusDiv.textContent = '⚠️ 输出为空，无法应用';
            return;
        }
        inputArea.value = output;
        outputArea.value = '';
        statusDiv.textContent = '✅ 已应用到输入，输出已清空';
    });

    function updateProgress(current, total, fileName, statusText) {
        progressContainer.style.display = 'block';
        const percent = total > 0 ? Math.round((current / total) * 100) : 0;
        progressBar.style.width = percent + '%';
        progressText.textContent = `正在加载 ${fileName} (${percent}%)`;
        if (statusText) loadStatus.textContent = statusText;
    }

    async function autoLoadFromTxtmap() {
        const fileNames = ['ch1', 'ch2', 'ch3', 'ch4', 'ch5', 'uty'];
        const basePath = 'txtmap/';
        const loadedData = {};
        let allLoaded = true;

        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        progressText.textContent = '准备加载...';

        for (let i = 0; i < fileNames.length; i++) {
            const name = fileNames[i];
            updateProgress(i, fileNames.length, name, `正在加载 ${name}.js ...`);
            try {
                const url = basePath + name + '.js';
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                const rawObj = new Function('return ' + text)();
                if (typeof rawObj === 'object' && rawObj !== null) {
                    loadedData[name] = rawObj;
                } else {
                    throw new Error('解析结果不是有效对象');
                }
            } catch (err) {
                console.warn(`自动加载 ${name}.js 失败:`, err);
                allLoaded = false;
                break;
            }
        }

        if (allLoaded && Object.keys(loadedData).length === fileNames.length) {
            progressBar.style.width = '100%';
            progressText.textContent = '✅ 全部加载完成！';
            dataStore = loadedData;
            loadingOverlay.classList.add('hidden');
            mainContent.style.display = 'block';
            const success = loadMapping('ch1');
            if (!success) {
                const first = Object.keys(dataStore)[0];
                if (first) {
                    loadMapping(first);
                    document.querySelectorAll('.mode-btn').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.dataset.mode === first) btn.classList.add('active');
                    });
                    currentMode = first;
                }
            }
            loadStatus.textContent = '✅ 已自动加载 txtmap 目录下的词典';
            loadStatus.className = 'status success';
            return true;
        } else {
            progressText.textContent = '⚠️ 自动加载失败，请手动选择文件夹';
            loadStatus.textContent = '请手动选择包含词典的文件夹';
            loadStatus.className = 'status error';
            progressContainer.style.display = 'none';
            return false;
        }
    }

    autoLoadFromTxtmap().then(success => {
        if (!success) {
            loadingOverlay.classList.remove('hidden');
            mainContent.style.display = 'none';
            loadStatus.textContent = '请手动选择包含词典的文件夹';
            loadStatus.className = 'status';
            progressContainer.style.display = 'none';
        }
    });

    folderInput.addEventListener('change', async function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) {
            loadStatus.textContent = '❌ 未选择任何文件';
            loadStatus.className = 'status error';
            return;
        }
        loadStatus.textContent = '⏳ 正在读取文件...';
        loadStatus.className = 'status';
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        progressText.textContent = '准备加载...';

        const fileMap = {};
        for (const file of files) {
            const name = file.name;
            if (!name.endsWith('.js')) continue;
            const base = name.replace(/\.js$/, '');
            if (!/^ch[1-5]$/.test(base) && base !== 'uty') continue;
            fileMap[base] = file;
        }
        const expected = ['ch1','ch2','ch3','ch4','ch5','uty'];
        const found = Object.keys(fileMap);
        const missing = expected.filter(m => !found.includes(m));
        if (found.length === 0) {
            loadStatus.textContent = '❌ 未找到任何 ch1~ch5.js 或 uty.js 文件';
            loadStatus.className = 'status error';
            progressContainer.style.display = 'none';
            return;
        }
        const loadedData = {};
        let errorCount = 0;
        let processed = 0;
        const totalFiles = found.length;
        for (const [mode, file] of Object.entries(fileMap)) {
            processed++;
            updateProgress(processed, totalFiles, file.name, `正在加载 ${file.name} ...`);
            try {
                const text = await file.text();
                const rawObj = new Function('return ' + text)();
                if (typeof rawObj === 'object' && rawObj !== null) {
                    loadedData[mode] = rawObj;
                } else {
                    throw new Error('文件内容不是有效对象');
                }
            } catch (err) {
                errorCount++;
                console.error(`加载 ${mode}.js 失败:`, err);
                loadStatus.textContent = `❌ 加载 ${mode}.js 失败: ${err.message}`;
                loadStatus.className = 'status error';
            }
        }
        progressBar.style.width = '100%';
        progressText.textContent = '✅ 加载完成！';
        if (Object.keys(loadedData).length === 0) {
            loadStatus.textContent = '❌ 所有文件加载失败，请检查格式';
            loadStatus.className = 'status error';
            progressContainer.style.display = 'none';
            return;
        }
        dataStore = loadedData;
        let msg = `✅ 成功加载 ${Object.keys(loadedData).length} 个词典文件`;
        if (missing.length > 0) msg += `，缺失: ${missing.join(', ')}`;
        if (errorCount > 0) msg += `，有 ${errorCount} 个文件加载失败（请查看控制台）`;
        loadStatus.textContent = msg;
        loadStatus.className = 'status success';
        loadingOverlay.classList.add('hidden');
        mainContent.style.display = 'block';
        const success = loadMapping('ch1');
        if (!success) {
            const first = Object.keys(dataStore)[0];
            if (first) {
                loadMapping(first);
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.mode === first) btn.classList.add('active');
                });
                currentMode = first;
            } else {
                statusDiv.textContent = '⚠️ 没有可用的词典数据';
            }
        }
    });

    modeBar.addEventListener('click', e => {
        const btn = e.target.closest('.mode-btn');
        if (!btn) return;
        switchMode(btn.dataset.mode);
    });
    processBtn.addEventListener('click', handleProcess);
    copyBtn.addEventListener('click', copyOutput);
    clearOutputBtn.addEventListener('click', clearOutput);
    pasteInputBtn.addEventListener('click', pasteToInput);

    // 初始状态
    loadingOverlay.classList.remove('hidden');
    mainContent.style.display = 'none';
    loadStatus.textContent = '等待加载...';
    loadStatus.className = 'status';
    progressContainer.style.display = 'none';
})();
</script>
</body>
</html>
